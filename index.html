<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Planner</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --border: #e3e3e6;
    --text: #1d1d1f;
    --muted: #767678;
    --accent: #0071e3;
    --low: #d0451f;
    --low-bg: #fdeeea;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px 16px 48px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .subtitle { color: var(--muted); margin-bottom: 20px; font-size: 13px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
  .controls label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  select {
    padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 13px; background: white; color: var(--text);
  }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; position: sticky; top: 0; background: var(--card); z-index: 1; box-shadow: 0 1px 0 var(--border); }
  tr.running-low { background: var(--low-bg); }
  /* Table wrappers. Desktop: not a scroll box, so sticky <th> pins to the page.
     Phones: the wrapper scrolls (sideways for wide tables, at most 70vh tall) and
     the header sticks inside it, so the page itself never scrolls sideways.
     The history pop-up's table never gets its own scroll box: its header sticks
     to the dialog's scroll instead. */
  .table-wrap { max-width: 100%; }
  @media (max-width: 767px) {
    .table-wrap { overflow: auto; max-height: 70vh; -webkit-overflow-scrolling: touch; }
  }
  @media (min-width: 768px) {
    .table-wrap { overflow: visible; }
  }
  dialog.history .table-wrap { overflow: visible; max-height: none; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .tag.low { background: var(--low); color: white; }
  .tag.ok { background: #e9f5ea; color: #1f7a34; }
  .muted { color: var(--muted); }
  canvas { }
  .chart-container { position: relative; height: 310px; width: 100%; }
  .chart-card { overflow: visible; }
  .version-tag {
    position: fixed; bottom: 10px; right: 12px; z-index: 999;
    font-size: 11px; color: var(--muted); background: var(--card);
    border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .loading { color: var(--muted); font-size: 13px; }
  .error { color: var(--low); font-size: 13px; }
  details summary {
    cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600;
    padding: 4px 0; list-style: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " ▾"; }
  details[open] summary::after { content: " ▴"; }
  .stale { color: var(--low); font-size: 12px; }
  button.link {
    background: none; border: 0; padding: 0; margin: 0; font: inherit; color: var(--accent);
    cursor: pointer; text-align: left;
  }
  button.link:hover { text-decoration: underline; }
  dialog.history {
    box-sizing: border-box; border: 1px solid var(--border); border-radius: 12px; padding: 0;
    width: min(760px, 92vw); max-height: 85vh;
    background: var(--card); color: var(--text);
  }
  dialog.history::backdrop { background: rgba(0, 0, 0, 0.35); }
  .history-inner { padding: 20px 24px; }
  .history-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .history-head h2 { margin: 0 0 2px; }
  .history-close {
    border: 0; background: none; font-size: 18px; line-height: 1; padding: 4px 6px;
    cursor: pointer; color: var(--muted);
  }
  .history-chart { position: relative; height: 240px; width: 100%; margin-bottom: 12px; }
  .history-summary { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .tag.promo { background: #fff4d6; color: #8a5a00; margin-left: 6px; }
</style>
</head>
<body>
<div class="version-tag">v20261002-3</div>

<dialog id="historyDialog" class="history">
  <div class="history-inner">
    <div class="history-head">
      <div>
        <h2 id="historyTitle"></h2>
        <div class="muted" id="historyCategory"></div>
      </div>
      <button type="button" class="history-close" aria-label="Close">&#x2715;</button>
    </div>
    <div class="history-chart-wrap">
      <div class="history-chart" id="historyChartBox"><canvas id="historyChart"></canvas></div>
      <div class="empty" id="historyChartNote" hidden>Not enough history for a chart.</div>
    </div>
    <div id="historyBody"></div>
    <div class="history-summary" id="historySummary"></div>
  </div>
</dialog>

<h1>Shopping Planner</h1>
<div class="subtitle" id="subtitle">Bulk-buy suggestions for stockable items — read-only, synced from GitHub</div>

<div class="card" id="statusCard"><div class="loading">Loading latest data…</div></div>

<div class="card" id="shoppingCard" style="display:none">
  <h2>What to stock up on now</h2>
  <div id="shoppingListBody"></div>
</div>

<div class="card" id="controlsCard" style="display:none">
  <div class="controls">
    <label>Rate over
      <select id="windowSelect">
        <option value="1">1 month</option>
        <option value="2">2 months</option>
        <option value="3" selected>3 months</option>
        <option value="6">6 months</option>
      </select>
    </label>
    <label>Buffer target
      <select id="bufferSelect">
        <option value="1">1 month</option>
        <option value="1.5">1.5 months</option>
        <option value="2" selected>2 months</option>
        <option value="3">3 months</option>
      </select>
    </label>
    <label>Sort by
      <select id="sortSelect">
        <option value="category" selected>Category</option>
        <option value="spend">Total spend</option>
        <option value="last">Longest since last bought</option>
      </select>
    </label>
    <label>Hide if not bought in
      <select id="staleSelect">
        <option value="3">3 months</option>
        <option value="6" selected>6 months</option>
        <option value="12">12 months</option>
        <option value="9999">Never (show everything)</option>
      </select>
    </label>
  </div>
</div>

<div class="card chart-card" id="chartCard" style="display:none">
  <h2>Monthly spend by category</h2>
  <div class="chart-container"><canvas id="spendChart"></canvas></div>
</div>

<div class="card" id="allProductsCard" style="display:none">
  <details>
    <summary>All products</summary>
    <div id="allProductsBody" style="margin-top:12px"></div>
  </details>
</div>

<script>
// ---------------------------------------------------------------------------
// CONFIG — fill these in to point at your repo
// ---------------------------------------------------------------------------
const GITHUB_USER   = "vopros21";
const GITHUB_REPO   = "grocery-planner";
const GITHUB_BRANCH = "main";
const ITEMS_CSV_PATH          = "data/items.csv";
const OVERRIDES_JSON_PATH     = "data/stockable_overrides.json";
const CATEGORY_JSON_PATH      = "data/category_overrides.json";

const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/`;
const ITEMS_URL         = RAW_BASE + ITEMS_CSV_PATH;
const OVERRIDES_URL     = RAW_BASE + OVERRIDES_JSON_PATH;
const CATEGORY_URL      = RAW_BASE + CATEGORY_JSON_PATH;

// ---------------------------------------------------------------------------
// Ported from analysis.py — same logic, same constants
// ---------------------------------------------------------------------------
const CORRUPTED_NAME_RE = /^\d+,\d+%\s+\d+,\d+\s+\d+,\d+$/;

const STOCKABLE_CATEGORIES = new Set([
  "talho", "peixaria", "congelados", "mercearia salgada", "mercearia doce", "conservas",
]);
const NOT_STOCKABLE_CATEGORIES = new Set([
  "frutas e legumes", "padaria", "pastelaria", "laticinios", "laticínios",
]);
const STOCKABLE_KEYWORDS = [
  "feijao", "feijão", "grao", "grão", "lentilha", "arroz", "massa", "esparguete",
  "atum", "sardinha", "conserva", "enlatado", "congelad",
  "azeite", "oleo", "óleo", "acucar", "açucar", "açúcar", "farinha", "cereais",
];
const PERISHABLE_KEYWORDS = [
  "alface", "tomate", "banana", "maca", "maçã", "laranja", "pao ", "pão ",
  "iogurte", "queijo fresco", "salada", "cogumelo", "morango", "uva",
];

const MIN_PURCHASE_DATES = 2;
const MIN_SPAN_DAYS = 14;
const DAYS_PER_MONTH = 30.44;

// A product with no purchase in this many months is considered "stale" —
// hidden from the planner by default (toggle-able), never deleted from the CSV.
const STALE_MONTHS_DEFAULT = 6;

function normalizeName(name) {
  return (name || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function guessStockable(category, name) {
  const cat = (category || "").trim().toLowerCase();
  if (STOCKABLE_CATEGORIES.has(cat)) return true;
  if (NOT_STOCKABLE_CATEGORIES.has(cat)) return false;
  const n = normalizeName(name);
  if (PERISHABLE_KEYWORDS.some(k => n.includes(k))) return false;
  if (STOCKABLE_KEYWORDS.some(k => n.includes(k))) return true;
  return false;
}

function toFloat(s) {
  const n = parseFloat(s);
  return Number.isNaN(n) ? 0 : n;
}

function parseISODate(s) {
  if (!s) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim());
  if (!m) return null;
  return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
}
function utcToday() {
  const d = new Date();
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
}
function diffDays(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }
function addDays(d, days) { return new Date(d.getTime() + days * 86400000); }
function roundTo(x, decimals) { const f = 10 ** decimals; return Math.round(x * f) / f; }
// Most common value; ties -> first seen (Map keeps insertion order, strict >).
function mode(arr) {
  const counts = new Map();
  for (const v of arr) counts.set(v, (counts.get(v) || 0) + 1);
  let best = arr[0], bestCount = -1;
  for (const [v, c] of counts) if (c > bestCount) { best = v; bestCount = c; }
  return best;
}

function loadItemsFromParsed(parsedRows) {
  return parsedRows.filter(row => !CORRUPTED_NAME_RE.test((row.name || "").trim()));
}

function resolveCategory(key, items, categoryOverrides) {
  // Override from category_overrides.json, else the most common receipt
  // category among the product's rows (ties -> first seen in CSV order), else "".
  const categoryOverride = categoryOverrides[key];
  if (categoryOverride) return categoryOverride;
  const categories = items.map(r => r.category).filter(Boolean);
  return categories.length ? mode(categories) : "";
}

function latestName(datedItems) {
  // Raw name on the most recent purchase (last CSV row on the latest date).
  // Used as the product's display name everywhere.
  const latestTime = Math.max(...datedItems.map(([d]) => d.getTime()));
  const atLatest = datedItems.filter(([d]) => d.getTime() === latestTime);
  return atLatest[atLatest.length - 1][1].name;
}

function computeProductStats(rows, overrides, categoryOverrides, bufferMonths, windowMonths, staleMonths) {
  categoryOverrides = categoryOverrides || {};
  staleMonths = staleMonths == null ? STALE_MONTHS_DEFAULT : staleMonths;
  const groups = new Map();
  for (const r of rows) {
    const key = normalizeName(r.name);
    if (!key) continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }

  const today = utcToday();
  const windowDays = windowMonths * DAYS_PER_MONTH;
  const staleCutoffDays = staleMonths * DAYS_PER_MONTH;
  const products = [];

  for (const [key, items] of groups) {
    const datedItems = [];
    for (const r of items) {
      const d = parseISODate(r.date);
      if (d) datedItems.push([d, r]);
    }
    if (!datedItems.length) continue;

    const distinctTimes = Array.from(new Set(datedItems.map(([d]) => d.getTime()))).sort((a, b) => a - b);
    const distinctDates = distinctTimes.map(t => new Date(t));
    const purchaseDatesCount = distinctDates.length;
    const firstDate = distinctDates[0];
    const lastDate = distinctDates[distinctDates.length - 1];
    const overallSpanDays = diffDays(firstDate, lastDate);

    const unitType = items.some(r => toFloat(r.weight_kg) > 0) ? "kg" : "un";
    const unitsFor = (r) => {
      const wk = toFloat(r.weight_kg);
      return (unitType === "kg" && wk > 0) ? wk : toFloat(r.qty);
    };

    const totalUnits = items.reduce((s, r) => s + unitsFor(r), 0);
    const totalSpend = items.reduce((s, r) => s + toFloat(r.total_price), 0);
    const displayName = latestName(datedItems);

    const category = resolveCategory(key, items, categoryOverrides);

    const enoughHistory = purchaseDatesCount >= MIN_PURCHASE_DATES && overallSpanDays >= MIN_SPAN_DAYS;

    let avgUnitsPerMonth = null, avgSpendPerMonth = null;
    if (enoughHistory) {
      const windowStart = addDays(today, -windowDays);
      const effectiveStart = windowStart.getTime() > firstDate.getTime() ? windowStart : firstDate;
      let effectiveSpanDays = diffDays(effectiveStart, today);
      effectiveSpanDays = Math.max(effectiveSpanDays, MIN_SPAN_DAYS);
      const effectiveSpanMonths = effectiveSpanDays / DAYS_PER_MONTH;

      const inWindow = datedItems.filter(([d]) => d.getTime() >= effectiveStart.getTime());
      const windowUnits = inWindow.reduce((s, [, r]) => s + unitsFor(r), 0);
      const windowSpend = inWindow.reduce((s, [, r]) => s + toFloat(r.total_price), 0);

      avgUnitsPerMonth = windowUnits / effectiveSpanMonths;
      avgSpendPerMonth = windowSpend / effectiveSpanMonths;
    }

    let stockable = Object.prototype.hasOwnProperty.call(overrides, key) ? overrides[key] : null;
    if (stockable === null) stockable = guessStockable(category, displayName);

    const daysSinceLast = diffDays(lastDate, today);
    let suggestedBuy = null, runningLow = false;
    if (stockable && avgUnitsPerMonth) {
      suggestedBuy = roundTo(avgUnitsPerMonth * bufferMonths, unitType === "kg" ? 2 : 0);
      const expectedCycleDays = overallSpanDays / (purchaseDatesCount - 1);
      runningLow = daysSinceLast >= expectedCycleDays;
    }

    const stale = daysSinceLast > staleCutoffDays;

    products.push({
      key,
      name: displayName,
      category: category || "(uncategorized — Lidl)",
      storesSeen: Array.from(new Set(items.map(r => r.store).filter(Boolean))).sort(),
      purchaseDatesCount,
      unitType,
      totalUnits: roundTo(totalUnits, 2),
      totalSpend: roundTo(totalSpend, 2),
      avgUnitsPerMonth: avgUnitsPerMonth ? roundTo(avgUnitsPerMonth, 2) : null,
      avgSpendPerMonth: avgSpendPerMonth ? roundTo(avgSpendPerMonth, 2) : null,
      lastDate: lastDate.toISOString().slice(0, 10),
      daysSinceLast,
      enoughHistory,
      stockable,
      suggestedBuy,
      runningLow,
      stale,
    });
  }

  return products;
}

function computeMonthlyCategorySpend(rows, categoryOverrides) {
  categoryOverrides = categoryOverrides || {};
  const monthly = new Map();
  for (const r of rows) {
    const d = parseISODate(r.date);
    if (!d) continue;
    const monthKey = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
    const override = categoryOverrides[normalizeName(r.name)];
    const cat = override || r.category || "(uncategorized)";
    if (!monthly.has(monthKey)) monthly.set(monthKey, new Map());
    const catMap = monthly.get(monthKey);
    catMap.set(cat, (catMap.get(cat) || 0) + toFloat(r.total_price));
  }
  return monthly;
}

function getProductHistory(rows, key, categoryOverrides) {
  // Every purchase row for one product (grouped like computeProductStats:
  // normalizeName key, corrupted rows dropped, category from resolveCategory),
  // newest first, plus a price summary.
  categoryOverrides = categoryOverrides || {};

  const items = [];
  for (const r of rows) {
    if (CORRUPTED_NAME_RE.test((r.name || "").trim())) continue;
    if (normalizeName(r.name) === key) items.push(r);
  }

  const datedItems = [];
  for (const r of items) {
    const d = parseISODate(r.date);
    if (d) datedItems.push([d, r]);
  }
  if (!datedItems.length) return null;

  const unitType = items.some(r => toFloat(r.weight_kg) > 0) ? "kg" : "un";

  const title = latestName(datedItems);

  const category = resolveCategory(key, items, categoryOverrides);

  // Newest first; stable sort keeps CSV order within the same date.
  datedItems.sort((a, b) => b[0].getTime() - a[0].getTime());

  const history = [];
  for (const [d, r] of datedItems) {
    const weightKg = toFloat(r.weight_kg);
    const isWeight = weightKg > 0;
    history.push({
      date: d.toISOString().slice(0, 10),
      store: r.store || "",
      is_weight: isWeight,
      qty: toFloat(r.qty),
      weight_kg: isWeight ? weightKg : null,
      price: isWeight ? toFloat(r.total_price) / weightKg : toFloat(r.unit_price),
      price_unit: isWeight ? "kg" : "un",
      discount: toFloat(r.discount),
    });
  }

  // Summary/chart unit = the unit most rows were sold in (ties -> kg, like unitType).
  const kgRows = history.filter(h => h.price_unit === "kg").length;
  const priceUnit = kgRows * 2 >= history.length ? "kg" : "un";
  const prices = history.filter(h => h.price_unit === priceUnit).map(h => h.price);
  const summary = {
    count: history.length,
    price_unit: priceUnit,
    priced_count: prices.length,
    min: prices.length ? Math.min(...prices) : null,
    max: prices.length ? Math.max(...prices) : null,
    avg: prices.length ? prices.reduce((s, p) => s + p, 0) / prices.length : null,
  };

  return {
    key,
    title,
    category: category || "(uncategorized — Lidl)",
    unit_type: unitType,
    rows: history,
    summary,
  };
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
let ALL_ROWS = [];
let OVERRIDES = {};
let CATEGORY_OVERRIDES = {};
let chartInstance = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// The purchase-history pop-up is desktop-only on this page: phones get the
// product name as plain text (see the historyDesktop change listener).
function productNameHtml(p) {
  return historyDesktop.matches
    ? `<button type="button" class="link" data-key="${esc(p.key)}">${esc(p.name)}</button>`
    : esc(p.name);
}

function render() {
  const bufferMonths = parseFloat(document.getElementById("bufferSelect").value);
  const windowMonths = parseFloat(document.getElementById("windowSelect").value);
  const sortBy = document.getElementById("sortSelect").value;
  const staleMonths = parseFloat(document.getElementById("staleSelect").value);

  const allProducts = computeProductStats(ALL_ROWS, OVERRIDES, CATEGORY_OVERRIDES, bufferMonths, windowMonths, staleMonths);
  const staleCount = allProducts.filter(p => p.stale).length;
  const products = allProducts.filter(p => !p.stale);
  const monthlySpend = computeMonthlyCategorySpend(ALL_ROWS, CATEGORY_OVERRIDES);

  // Shopping list
  const shoppingList = products
    .filter(p => p.stockable && p.suggestedBuy)
    .sort((a, b) => {
      if (a.runningLow !== b.runningLow) return a.runningLow ? -1 : 1;
      if (a.category !== b.category) return a.category < b.category ? -1 : 1;
      return a.name < b.name ? -1 : 1;
    });

  const shoppingBody = document.getElementById("shoppingListBody");
  if (!shoppingList.length) {
    shoppingBody.innerHTML = `<div class="empty">No stockable products with enough purchase history yet. Needs a product bought on 2+ shopping dates, 14+ days apart, before a rate is estimated.</div>`;
  } else {
    let html = `<div class="table-wrap"><table><tr><th>Product</th><th>Avg/mo</th><th>Buy now (${bufferMonths}mo)</th><th>Last</th><th>Status</th></tr>`;
    for (const p of shoppingList) {
      html += `<tr class="${p.runningLow ? "running-low" : ""}">
        <td>${productNameHtml(p)}<div class="muted" style="font-size:11px">${esc(p.category)}</div></td>
        <td>${p.avgUnitsPerMonth} ${esc(p.unitType)}</td>
        <td><strong>${p.suggestedBuy} ${esc(p.unitType)}</strong></td>
        <td class="muted">${p.daysSinceLast}d ago</td>
        <td>${p.runningLow ? '<span class="tag low">running low</span>' : '<span class="tag ok">stocked</span>'}</td>
      </tr>`;
    }
    html += "</table></div>";
    shoppingBody.innerHTML = html;
  }

  // All products table
  let sortedProducts = products.slice();
  if (sortBy === "spend") sortedProducts.sort((a, b) => b.totalSpend - a.totalSpend);
  else if (sortBy === "last") sortedProducts.sort((a, b) => b.daysSinceLast - a.daysSinceLast);
  else sortedProducts.sort((a, b) => (a.category === b.category ? (a.name < b.name ? -1 : 1) : (a.category < b.category ? -1 : 1)));

  let allHtml = `<div class="table-wrap"><table><tr><th>Product</th><th>Category</th><th>Store(s)</th><th>Dates</th><th>Spend</th><th>Avg/mo</th><th>Last</th><th>Stockable?</th></tr>`;
  for (const p of sortedProducts) {
    const rateCell = p.avgUnitsPerMonth
      ? `${p.avgUnitsPerMonth} ${esc(p.unitType)}`
      : (!p.enoughHistory ? `<span class="muted">need more history</span>` : `<span class="muted">n/a</span>`);
    allHtml += `<tr class="${p.runningLow ? "running-low" : ""}">
      <td>${productNameHtml(p)}</td>
      <td>${esc(p.category)}</td>
      <td class="muted">${esc(p.storesSeen.join(", "))}</td>
      <td>${p.purchaseDatesCount}</td>
      <td>&euro;${p.totalSpend.toFixed(2)}</td>
      <td>${rateCell}</td>
      <td class="muted">${p.lastDate}</td>
      <td>${p.stockable ? '<span class="tag ok">stockable</span>' : '<span class="muted">not stockable</span>'}</td>
    </tr>`;
  }
  allHtml += "</table></div>";
  if (staleCount > 0) {
    allHtml += `<div class="muted" style="margin-top:8px">${staleCount} product${staleCount === 1 ? "" : "s"} hidden — not bought in over ${staleMonths} months. Set "Hide if not bought in" to "Never" to see them.</div>`;
  }
  document.getElementById("allProductsBody").innerHTML = allHtml;

  // Chart
  const months = Array.from(monthlySpend.keys()).sort();
  const allCategories = Array.from(new Set(
    Array.from(monthlySpend.values()).flatMap(m => Array.from(m.keys()))
  )).sort();
  const chartCard = document.getElementById("chartCard");
  if (months.length) {
    chartCard.style.display = "";
    // One distinct color per category (golden-angle hue rotation) instead of a
    // short fixed palette — see planner.html for why this matters once there
    // are more categories than palette entries.
    const colorForIndex = (i) => {
      const hue = (i * 137.508) % 360;
      const sat = 55 + (i % 3) * 12;
      const light = 45 + (i % 2) * 8;
      return `hsl(${hue.toFixed(1)}, ${sat}%, ${light}%)`;
    };
    const datasets = allCategories.map((cat, i) => ({
      label: cat,
      data: months.map(m => roundTo((monthlySpend.get(m) || new Map()).get(cat) || 0, 2)),
      backgroundColor: colorForIndex(i),
    }));

    // Precompute each month's total for the "above bar" label and tooltip footer
    const monthTotals = months.map((m, i) =>
      datasets.reduce((sum, ds) => sum + (ds.data[i] || 0), 0)
    );

    // Chart.js auto-scales the y-axis max to a "nice" tick right above the
    // highest total, which can leave almost no headroom for that bar's label
    // (e.g. total 682 vs auto max 700) and clip it against the canvas edge.
    // Pad the axis max ourselves so there's always room above the tallest bar.
    const maxTotal = Math.max(...monthTotals, 0);
    const yMax = maxTotal > 0 ? Math.ceil((maxTotal * 1.15) / 10) * 10 : undefined;

    const totalsLabelPlugin = {
      id: "totalsLabel",
      afterDatasetsDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        ctx.save();
        ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        ctx.fillStyle = "#1d1d1f";
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        months.forEach((month, i) => {
          const xPos = x.getPixelForValue(i);
          const yPos = y.getPixelForValue(monthTotals[i]);
          ctx.fillText("\u20ac" + monthTotals[i].toFixed(2), xPos, yPos - 6);
        });
        ctx.restore();
      },
    };

    if (chartInstance) chartInstance.destroy();
    chartInstance = new Chart(document.getElementById("spendChart"), {
      type: "bar",
      data: { labels: months, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 32 } },
        scales: {
          x: { stacked: true },
          y: {
            stacked: true,
            title: { display: true, text: "EUR" },
            max: yMax,
          },
        },
        plugins: {
          legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
          tooltip: {
            mode: "point",
            intersect: true,
            callbacks: {
              footer: (items) => {
                if (!items.length) return "";
                return "Month total: \u20ac" + monthTotals[items[0].dataIndex].toFixed(2);
              },
            },
            footerFont: { weight: "700" },
          },
        },
      },
      plugins: [totalsLabelPlugin],
    });
  } else {
    chartCard.style.display = "none";
  }
}

// ---------------------------------------------------------------------------
// Purchase-history pop-up (product name click). Rendered with textContent
// only — product names come straight from receipt text.
// ---------------------------------------------------------------------------
const historyDialog = document.getElementById("historyDialog");
const historyDesktop = window.matchMedia("(min-width: 768px)");
const STORE_COLORS = { Continente: "#d0451f", Lidl: "#0071e3" };
let historyChart = null;

function destroyHistoryChart() {
  if (historyChart) { historyChart.destroy(); historyChart = null; }
}

function historyCell(tr, text, cls) {
  const td = tr.insertCell();
  td.textContent = text;
  if (cls) td.className = cls;
  return td;
}

function fmtEur(x) { return "€" + x.toFixed(2); }
function fmtNum(x) { return String(+x.toFixed(3)); }

function renderHistory(h) {
  destroyHistoryChart();
  document.getElementById("historyTitle").textContent = h.title;
  document.getElementById("historyCategory").textContent = h.category;

  // Table, newest first (already ordered by getProductHistory)
  const table = document.createElement("table");
  const head = table.createTHead().insertRow();
  ["Date", "Store", "Qty", "Price per item"].forEach(t => {
    const th = document.createElement("th"); th.textContent = t; head.appendChild(th);
  });
  const tbody = table.createTBody();
  for (const r of h.rows) {
    const tr = tbody.insertRow();
    historyCell(tr, r.date, "muted");
    historyCell(tr, r.store);
    historyCell(tr, r.is_weight ? `${fmtNum(r.weight_kg)} kg` : fmtNum(r.qty));
    const priceTd = historyCell(tr, fmtEur(r.price) + (r.is_weight ? "/kg" : ""));
    if (r.discount > 0) {
      const tag = document.createElement("span");
      tag.className = "tag promo";
      tag.textContent = "promo −" + fmtEur(r.discount);
      priceTd.appendChild(tag);
    }
  }
  const wrap = document.createElement("div");
  wrap.className = "table-wrap";
  wrap.appendChild(table);
  document.getElementById("historyBody").replaceChildren(wrap);

  const s = h.summary;
  const suffix = s.price_unit === "kg" ? "/kg" : "";
  document.getElementById("historySummary").textContent =
    `${s.count} purchase${s.count === 1 ? "" : "s"}` +
    (s.min == null ? "" : ` · min ${fmtEur(s.min)}${suffix} · max ${fmtEur(s.max)}${suffix} · avg ${fmtEur(s.avg)}${suffix}`) +
    (s.priced_count < s.count ? ` (prices from the ${s.priced_count} ${s.price_unit === "kg" ? "by-weight" : "per-item"} purchases)` : "");

  // Price chart — desktop only; one line per store, prices in the product's main unit
  const points = h.rows.filter(r => r.price_unit === s.price_unit);
  const chartBox = document.getElementById("historyChartBox");
  const chartNote = document.getElementById("historyChartNote");
  const enough = points.length >= 2;
  chartBox.hidden = !enough;
  chartNote.hidden = enough;
  if (!enough || !historyDesktop.matches) return;

  const stores = Array.from(new Set(points.map(r => r.store))).sort();
  const datasets = stores.map((store, i) => {
    const color = STORE_COLORS[store] || `hsl(${((i * 137.508) % 360).toFixed(1)}, 55%, 45%)`;
    return {
      label: store || "(unknown store)",
      data: points
        .filter(r => r.store === store)
        .map(r => ({ x: Date.parse(r.date), y: r.price }))
        .sort((a, b) => a.x - b.x),
      borderColor: color,
      backgroundColor: color,
      tension: 0,
      pointRadius: 3,
    };
  });
  const fmtDate = (ms) => new Date(ms).toISOString().slice(0, 10);
  historyChart = new Chart(document.getElementById("historyChart"), {
    type: "line",
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { type: "linear", ticks: { callback: fmtDate, maxRotation: 0, autoSkipPadding: 16 } },
        y: { title: { display: true, text: s.price_unit === "kg" ? "EUR / kg" : "EUR / item" } },
      },
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: (items) => (items.length ? fmtDate(items[0].parsed.x) : ""),
            label: (item) => `${item.dataset.label}: ${fmtEur(item.parsed.y)}${suffix}`,
          },
        },
      },
    },
  });
}

historyDialog.addEventListener("close", destroyHistoryChart);
// Desktop-only: crossing 768px (window resize, phone rotation) re-renders the
// tables so product names switch between links and plain text.
historyDesktop.addEventListener("change", () => {
  if (!historyDesktop.matches && historyDialog.open) historyDialog.close();
  if (ALL_ROWS.length) render();
});
historyDialog.querySelector(".history-close").addEventListener("click", () => historyDialog.close());
// Backdrop click: the dialog itself has no padding, so a click whose target is
// the <dialog> element can only have landed on the backdrop.
historyDialog.addEventListener("click", (e) => { if (e.target === historyDialog) historyDialog.close(); });
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button.link[data-key]");
  if (btn) openHistory(btn.dataset.key);
});

function openHistory(key) {
  if (!historyDesktop.matches) return;
  const h = getProductHistory(ALL_ROWS, key, CATEGORY_OVERRIDES);
  if (!h) return;
  if (!historyDialog.open) historyDialog.showModal();
  renderHistory(h);
}

async function fetchJson(url) {
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return {};
    return await res.json();
  } catch {
    return {};
  }
}

async function init() {
  const statusCard = document.getElementById("statusCard");
  try {
    const [itemsRes, overrides, categoryOverrides] = await Promise.all([
      fetch(ITEMS_URL, { cache: "no-store" }),
      fetchJson(OVERRIDES_URL),
      fetchJson(CATEGORY_URL),
    ]);
    if (!itemsRes.ok) throw new Error(`Could not fetch items.csv (HTTP ${itemsRes.status})`);
    const csvText = await itemsRes.text();
    const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
    ALL_ROWS = loadItemsFromParsed(parsed.data);
    OVERRIDES = overrides;
    CATEGORY_OVERRIDES = categoryOverrides;

    const dates = ALL_ROWS.map(r => parseISODate(r.date)).filter(Boolean);
    const latest = dates.length ? new Date(Math.max(...dates.map(d => d.getTime()))) : null;
    statusCard.style.display = "none";
    document.getElementById("subtitle").textContent =
      `Bulk-buy suggestions for stockable items` +
      (latest ? ` · latest receipt: ${latest.toISOString().slice(0, 10)}` : "");

    document.getElementById("shoppingCard").style.display = "";
    document.getElementById("controlsCard").style.display = "";
    document.getElementById("allProductsCard").style.display = "";

    ["windowSelect", "bufferSelect", "sortSelect", "staleSelect"].forEach(id =>
      document.getElementById(id).addEventListener("change", render)
    );

    render();
  } catch (err) {
    statusCard.innerHTML = `<div class="error">Failed to load data: ${esc(err.message)}. Check the GITHUB_USER / GITHUB_REPO / paths at the top of this file, and that items.csv has been pushed.</div>`;
  }
}

init();
</script>
